[project]
name = "medibot"
version = "0.1.0"
description = "Advanced RAG assistant for MediAssist Health Network with retrieval-layer RBAC"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.10.0",
    "groq>=0.13.0",
    "qdrant-client[fastembed]>=1.12.0",
    "docling>=2.15.0",
    "docling-core[chunking]>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "playwright>=1.62.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.uv]
package = false
