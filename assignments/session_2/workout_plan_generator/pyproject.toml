[project]
name = "workout-plan-generator"
version = "0.1.0"
description = "Streamlit app that generates personalised weekly workout plans with Groq"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.49.0",
    "groq>=0.13.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
