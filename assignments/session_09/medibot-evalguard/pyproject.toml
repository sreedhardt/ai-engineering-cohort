[project]
name = "medibot-evalguard"
version = "0.1.0"
description = "Evaluation and guardrail platform wrapping the MediBot RAG assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Guardrails + judging
    "openevals>=0.2.0",
    "groq>=0.13.0",
    "langchain-groq>=1.1.0",
    # Evaluation
    "ragas>=0.4.0",
    # Observability
    "langsmith>=0.14.0",
    # Gateway
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.10.0",
    # Needed to import the target system's retrieval path in-process
    "qdrant-client[fastembed]>=1.12.0",
    "langchain-community==0.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
